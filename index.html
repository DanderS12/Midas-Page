<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Midas Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:wght@400;600&display=swap">
<style>
:root{--bg:#0b0805;--panel:#17110a;--gold:#f5c542;--gold2:#c8921b;--gold3:#fff1b0;--text:#f3e6c4;--muted:#b9a273;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at top,#2a1c06 0,var(--bg) 60%);color:var(--text);font-family:Lora,Georgia,serif;min-height:100vh}
#glitter{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3,nav a,button,.btn{font-family:Cinzel,Georgia,serif}
.gold{background:linear-gradient(90deg,var(--gold2),var(--gold3),var(--gold),var(--gold2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
header{position:relative;text-align:center;padding:18px clamp(104px,22vw,190px) 6px}
.corner{position:absolute;top:8px;left:0;width:clamp(90px,20vw,170px);aspect-ratio:2/3;object-fit:cover;object-position:top;border:2px solid var(--gold2);border-radius:10px;box-shadow:0 0 22px rgba(245,197,66,.5);cursor:zoom-in}
h1{font-size:clamp(2rem,7vw,3.6rem);margin:0;letter-spacing:.08em}
.sub{color:var(--muted);font-style:italic;margin:4px 0 0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px;position:sticky;top:env(safe-area-inset-top,0px);padding:8px 0;background:linear-gradient(var(--bg),rgba(11,8,5,.85));z-index:5}
nav a{color:var(--gold);text-decoration:none;border:1px solid var(--gold2);padding:8px 16px;border-radius:999px;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
nav a.on,nav a:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204}
.card{background:linear-gradient(160deg,#1f1609,var(--panel));border:1px solid var(--gold2);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 0 24px rgba(245,197,66,.12),inset 0 0 30px rgba(245,197,66,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ph{position:relative;border:2px solid var(--gold2);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 14px rgba(245,197,66,.25)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.ph p{margin:0;padding:8px 10px;font-size:.85rem;color:var(--gold3)}
button,.btn{background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3));color:#1a1204;border:0;border-radius:8px;padding:10px 18px;font-weight:700;letter-spacing:.06em;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
button.del{background:#5a1010;color:#ffd7d7;padding:5px 10px;font-size:.75rem}
.ph button.del{position:absolute;top:6px;right:6px}
input,textarea{width:100%;background:#0e0a04;color:var(--text);border:1px solid var(--gold2);border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
label{display:block;color:var(--gold);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
.cm{border-bottom:1px solid #3a2a0c;padding:10px 0}.cm b{color:var(--gold)}.cm small{color:var(--muted);margin-left:8px}
.cm p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.center{text-align:center}.muted{color:var(--muted)}.note{font-size:.82rem;color:var(--muted)}
.disc{width:150px;height:150px;border-radius:50%;margin:10px auto 18px;background:conic-gradient(var(--gold2),var(--gold3),var(--gold),var(--gold2),var(--gold3),var(--gold2));border:6px solid #1a1204;box-shadow:0 0 40px rgba(245,197,66,.5);position:relative}
.disc:after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--bg)}
.disc.spin{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
audio{width:100%;margin:12px 0}
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#2a1c06,#050302);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{max-width:380px;width:100%;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#lb img{max-width:100%;max-height:100%;border:3px solid var(--gold2);border-radius:8px}
.err{color:#ff9d9d;min-height:1.2em;font-size:.85rem}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(#17110a,#0b0805);border-top:1px solid var(--gold2);box-shadow:0 -6px 24px rgba(245,197,66,.2)}
#bar span{font-family:Cinzel,Georgia,serif;color:var(--gold);font-size:.85rem}
#bar audio{flex:1 1 220px;max-width:420px;margin:0}
.like{background:none;border:1px solid var(--gold2);color:var(--gold);padding:4px 14px;margin:2px 10px 10px;border-radius:999px;font-size:.9rem}
.eb{display:flex;flex-wrap:wrap;gap:3px;margin:-4px 0 10px}
.eb button{background:none;border:1px solid #3a2a0c;border-radius:8px;font-size:1.15rem;padding:2px 7px;cursor:pointer;color:inherit}
.roomwrap{border-radius:16px;padding:16px;border:1px solid var(--gold2);margin-bottom:18px}
.roomwrap .card{background:var(--panel)}
.roomwrap button,.roomwrap .btn{background:var(--btn);color:var(--btnt)}
.pin{position:absolute;top:6px;left:8px;font-size:1.4rem;filter:drop-shadow(0 0 4px #000)}
.ph button.pinb{left:6px;right:auto;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204}
.storybox{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.storypics{flex:0 1 260px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.storypics .ph img{aspect-ratio:auto;object-fit:contain;max-height:420px;background:#000}
.storytext{flex:1 1 300px;min-width:0}
select{width:100%;padding:10px;background:#0e0a04;color:var(--text);border:1px solid var(--gold2);border-radius:8px;margin-bottom:10px;font:inherit}
.like.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204}
@media (prefers-reduced-motion:reduce){.gold,.disc.spin{animation:none}}
</style>
</head>
<body>
<canvas id="glitter"></canvas>

<div id="gate"><div class="card">
  <h1 class="gold" style="font-size:2.2rem">The Midas Room</h1>
  <p class="sub">Everything here turns to gold.</p>
  <label for="gp">Password</label>
  <input id="gp" type="password" autocomplete="off" placeholder="Enter the password">
  <div class="err" id="gerr"></div>
  <button id="gbtn">Enter</button>
</div></div>

<div id="lb"><img alt=""></div>
<div id="bar"><span id="bt"></span><audio id="au" controls loop preload="auto"></audio></div>

<div class="wrap">
  <header><img class="corner" id="cr" src="media/corner1.jpg" alt="Golden portrait" onclick="document.getElementById('lb').querySelector('img').src=this.src;document.getElementById('lb').style.display='flex'"><h1><span>👑</span> <span class="gold">The Midas Room</span> <span>👑</span></h1><p class="sub">A private gallery of golden moments</p></header>
  <nav id="nav">
    <a href="#home">✨ Gallery</a><a href="#comic">📜 Comic</a><a href="#story">👑 Story</a><a href="#chat">💬 Live Chat</a><a href="#login">🔐 Login</a><a href="#rooms">🏆 Rooms</a><a href="#dm">💌 Messages</a><a href="#voice">🎙️ Voice</a><a href="#settings">⚙️ Settings</a><a href="#nsfw">🔞 18+</a><a href="#give">🪙 Donate</a><a href="#admin">🔑 Admin</a>
  </nav>
  <main id="view"></main>
</div>

<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const onSnap=function(ref,next){return onSnapshot(ref,next,function(e){if(window.fbError)window.fbError(e);});};
const C=window.SITE||{};
function shrink(file){
  return new Promise(function(res,rej){
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      let w=img.width,h=img.height,m=Math.max(w,h),mx=900;
      if(m>mx){w=Math.round(w*mx/m);h=Math.round(h*mx/m);}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.75,d=cv.toDataURL("image/jpeg",q);
      while(d.length>850000&&q>0.3){q-=0.1;d=cv.toDataURL("image/jpeg",q);}
      URL.revokeObjectURL(u);
      if(d.length>900000)rej(new Error("Picture is too big"));else res(d);
    };
    img.onerror=function(){rej(new Error("Could not read that picture"));};
    img.src=u;
  });
}
if(C.firebase&&C.firebase.apiKey){
  const app=initializeApp(C.firebase),fs=getFirestore(app),au=getAuth(app);
  const wd=function(ref){return {
    set:function(d){return setDoc(ref,d);},
    update:function(d){return updateDoc(ref,d);},
    delete:function(){return deleteDoc(ref);},
    onSnapshot:function(cb){return onSnap(ref,function(s){cb({exists:s.exists(),data:function(){return s.data();}});});}
  };};
  window.FB={
    db:{
      collection:function(n){return {
        doc:function(id){return wd(doc(fs,n,id));},
        onSnapshot:function(cb,o){var q=collection(fs,n);if(o&&o.limit)q=query(q,orderBy("ts","desc"),limit(o.limit));if(o&&o.where)q=query(q,where(o.where[0],o.where[1],o.where[2]));return onSnap(q,function(s){cb({docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data();}};})});});}
      };},
      doc:function(p){return wd(doc(fs,...p.split("/")));}
    },
    assets:{upload:function(f){return shrink(f).then(function(u){return {url:u,id:""};});},delete:function(){return Promise.resolve();}},
    login:function(pw){return signInWithEmailAndPassword(au,C.adminEmail,pw);},
    signin:function(e,pw){return signInWithEmailAndPassword(au,e,pw);},
    signup:function(e,pw){return createUserWithEmailAndPassword(au,e,pw);},
    logout:function(){return signOut(au);},
    onAuth:function(cb){return onAuthStateChanged(au,cb);}
  };
  dispatchEvent(new Event("fb-ready"));
}
</script>
<script>
(function(){
var PW="gold",APW="Dander_Midas";
var state={photos:[],comments:[],comics:[],likes:[],chat:[],users:[],dmIn:[],dmOut:[],voice:{},age:{},stories:[],myStories:[],adult:false,adults:[],nsfw:[],settings:{}};
var db=null,assets=null,view=document.getElementById("view");
var isAdmin=false,me=null;
var errShown=false;
window.fbError=function(e){
  if(errShown)return;errShown=true;
  var b=h("div",{style:"position:fixed;left:8px;right:8px;bottom:8px;z-index:60;background:#5a1010;color:#ffd7d7;padding:10px 14px;border-radius:10px;font-size:.85rem;cursor:pointer",text:"Database message: "+((e&&e.code)||"error")+". If you just updated the site, publish the newest firestore.rules in Firebase. (tap to hide)",onclick:function(){b.remove();}});
  document.body.appendChild(b);
};

function h(tag,attrs,kids){var e=document.createElement(tag);for(var k in (attrs||{})){if(k==="text")e.textContent=attrs[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c);});return e;}
function store(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){return null;}}
function lstore(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

/* ---------- gate ---------- */
var gate=document.getElementById("gate");
function tryGate(){
  if(document.getElementById("gp").value===PW){store("midas-in","1");gate.style.display="none";}
  else document.getElementById("gerr").textContent="That is not the golden word.";
}
document.getElementById("gbtn").onclick=tryGate;
document.getElementById("gp").addEventListener("keydown",function(e){if(e.key==="Enter")tryGate();});
if(store("midas-in")==="1")gate.style.display="none";
isAdmin=false;

/* ---------- lightbox ---------- */
var lb=document.getElementById("lb");
lb.onclick=function(){lb.style.display="none";};
function zoom(u){lb.querySelector("img").src=u;lb.style.display="flex";}

/* ---------- routing ---------- */
function route(){
  var r=(location.hash||"#home").slice(1),rid=null;
  if(r.indexOf("room-")===0){rid=r.slice(5);r="room";}
  if(["home","comic","story","chat","login","rooms","settings","nsfw","room","dm","voice","give","admin"].indexOf(r)<0)r="home";
  if(roomUnsub){try{roomUnsub();}catch(e){}roomUnsub=null;}
  roomSong=null;roomFx=null;
  document.querySelectorAll("#nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+(r==="room"?"rooms":r));});
  view.innerHTML="";
  ({home:pHome,comic:pComic,story:pStory,chat:pChat,rooms:pRooms,login:pLogin,settings:pMyRoom,nsfw:pNsfw,room:function(){pRoom(rid);},dm:pDM,voice:pVoice,give:pGive,admin:pAdmin})[r]();
  setFx(roomFx);
  if(roomSong)setSong(100,roomSong.url,roomSong.title);else setSong({home:1,comic:2,story:3,give:4,admin:5}[r]||0);
  var cr=document.getElementById("cr");
  var pics={give:["media/corner2.jpg","50% 12%"],story:["media/corner3.jpg","22% 18%"],comic:["media/corner4.jpg","30% 12%"]};
  var pk=pics[r]||["media/corner1.jpg","top"];
  cr.src=pk[0];
  cr.style.objectPosition=pk[1];
}
window.addEventListener("hashchange",route);

/* ---------- gallery + comments ---------- */
function pHome(){
  var c=h("div",{"class":"card"},[h("h2",{"class":"gold",text:"The Gallery"})]);
  var g=h("div",{"class":"grid"});
  var ps=state.photos.slice().sort(function(a,b){return (b.pinned?1:0)-(a.pinned?1:0)||b.ts-a.ts;});
  if(!ps.length)c.appendChild(h("p",{"class":"muted",text:"No photos yet. The owner can add some from the Admin page."}));
  ps.forEach(function(p){
    var d=h("div",{"class":"ph"},[h("img",{src:p.url,alt:p.cap||"Photo",onclick:function(){zoom(p.url);}})]);
    if(p.cap)d.appendChild(h("p",{text:p.cap}));
    d.appendChild(likeBtn(p));
    if(p.pinned&&!isAdmin)d.appendChild(h("span",{"class":"pin",text:"📌"}));
    if(isAdmin)d.appendChild(h("button",{"class":"del pinb",text:p.pinned?"Unpin":"📌 Pin",onclick:function(){db.collection("photos").doc(p.id).update({pinned:!p.pinned});}}));
    if(isAdmin)d.appendChild(h("button",{"class":"del",text:"Delete",onclick:function(){delPhoto(p);}}));
    g.appendChild(d);
  });
  c.appendChild(g);view.appendChild(c);

  var cc=h("div",{"class":"card"},[h("h2",{"class":"gold",text:"Comments"})]);
  var nm=h("input",{placeholder:"Your name",maxlength:"40"});nm.value=lstore("midas-name")||"";
  var tx=h("textarea",{placeholder:"Leave a golden word…",rows:"3",maxlength:"500"});
  var er=h("div",{"class":"err"});
  cc.appendChild(nm);cc.appendChild(tx);cc.appendChild(emojiBar(tx));cc.appendChild(er);
  cc.appendChild(h("button",{text:"Post comment",onclick:function(){
    var t=tx.value.trim();if(!t)return;
    if(!db){er.textContent="Comments are not connected yet.";return;}
    lstore("midas-name",nm.value);
    var id="c"+Date.now()+Math.random().toString(36).slice(2,6);
    db.collection("comments").doc(id).set({name:nm.value.trim()||"Guest",text:t,ts:Date.now()}).then(function(){tx.value="";er.textContent="";}).catch(function(e){er.textContent="Could not post: "+(e&&e.message||"error");});
  }}));
  var list=h("div",{style:"margin-top:14px"});
  state.comments.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(m){
    var row=h("div",{"class":"cm"},[h("b",{text:m.name}),h("small",{text:new Date(m.ts).toLocaleString()}),h("p",{text:m.text})]);
    if(isAdmin)row.appendChild(h("button",{"class":"del",text:"Delete",onclick:function(){db.collection("comments").doc(m.id).delete();}}));
    list.appendChild(row);
  });
  if(!state.comments.length)list.appendChild(h("p",{"class":"muted",text:"No comments yet. Be the first."}));
  cc.appendChild(list);view.appendChild(cc);
}
function delPhoto(p){
  if(!confirm("Delete this photo for good?"))return;
  state.likes.forEach(function(l){if(l.pid===p.id)db.collection("likes").doc(l.id).delete().catch(function(){});});
  db.collection("photos").doc(p.id).delete().then(function(){if(assets&&p.aid)assets.delete(p.aid).catch(function(){});});
}

/* ---------- music (one song per page, looping) ---------- */
var au=document.getElementById("au"),bar=document.getElementById("bar"),bt=document.getElementById("bt");
au.loop=true;
var unlocked=false,lastN=-1;
function unlock(){
  if(unlocked)return;
  if(au.getAttribute("data-u")&&au.paused){au.play().then(function(){unlocked=true;}).catch(function(){});}
  else unlocked=true;
}
["pointerdown","pointerup","click","touchend","keydown"].forEach(function(e){addEventListener(e,unlock,{passive:true});});
function setSong(n,ou,ot){
  var nav=n!==lastN;lastN=n;
  var url=ou||(n?state.settings["song"+n]:"");
  if(!url){au.pause();bar.style.display="none";return;}
  bar.style.display="flex";
  bt.textContent="♪ "+(ot||state.settings["title"+n]||(n===1?"Gallery song":"Comic song"))+" (on loop)";
  var changed=au.getAttribute("data-u")!==url;
  if(changed){au.src=url;au.setAttribute("data-u",url);}
  if(unlocked&&(changed||nav)){au.play().catch(function(){});}
  else if(!unlocked){au.play().catch(function(){});}
}

/* ---------- comic ---------- */
function pComic(){
  var c=h("div",{"class":"card"},[h("h2",{"class":"gold",text:"The Comic"})]);
  var cs=state.comics.slice().sort(function(a,b){return a.ts-b.ts;});
  if(!cs.length)c.appendChild(h("p",{"class":"muted",text:"No comic pages yet. The owner can add them from the Admin page."}));
  cs.forEach(function(p,i){
    var d=h("div",{"class":"ph",style:"margin-bottom:16px"},[h("img",{src:p.url,alt:"Comic page "+(i+1),style:"aspect-ratio:auto;object-fit:contain",onclick:function(){zoom(p.url);}})]);
    d.appendChild(h("p",{text:"Page "+(i+1)+(p.cap?" - "+p.cap:"")}));
    if(isAdmin)d.appendChild(h("button",{"class":"del",text:"Delete",onclick:function(){
      if(!confirm("Delete this comic page for good?"))return;
      db.collection("comics").doc(p.id).delete().then(function(){if(assets&&p.aid)assets.delete(p.aid).catch(function(){});});
    }}));
    c.appendChild(d);
  });
  view.appendChild(c);
}

/* ---------- accounts, rooms, messages, voice ---------- */
var roomUnsub=null,roomSong=null,roomFx=null,roomTrack={},stTab="midas",stEdit=null,stNewId=null,storyTrack={},afterLogin="",nsfwSub=false,dmUnsubs=[],dmWith="",dmBox=null,dmForm=null;
var EMO=["👑","✨","🌟","💛","🪙","🏆","🥇","⭐","💫","🍯","🔱","🐾"];
function emojiBar(inp){var d=h("div",{"class":"eb"});EMO.forEach(function(e){d.appendChild(h("button",{type:"button",text:e,onclick:function(){inp.value+=e;inp.focus();}}));});return d;}
function isHex(c){return /^#[0-9a-fA-F]{6}$/.test(c||"");}
function isHttps(u){return /^https:\/\//i.test(u||"");}
function mix(hex,t,f){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,tr=t>>16,tg=(t>>8)&255,tb=t&255;function m(a,c){return Math.round(a+(c-a)*f);}return "#"+((1<<24)+(m(r,tr)<<16)+(m(g,tg)<<8)+m(b,tb)).toString(16).slice(1);}
var DEFR={accent:"#f5c542",bg:"#0b0805",panel:"#17110a",text:"#f3e6c4",border:"#c8921b",btn:"#f5c542",gs:"sparkle",gc:"#ffd24a",ps:"paws",pc:"#e8b230"};
var GV=["sparkle","dots","stars","hearts","flowers","snow","none"],PV=["paws","hearts","stars","flowers","snow","none"];
var GOPT=[["sparkle","✨ Sparkles"],["dots","⚪ Dots"],["stars","⭐ Stars"],["hearts","💛 Hearts"],["flowers","🌸 Flowers"],["snow","❄️ Snowflakes"],["none","None"]];
var POPT=[["paws","🐾 Paw prints"],["hearts","💛 Hearts"],["stars","⭐ Stars"],["flowers","🌸 Flowers"],["snow","❄️ Snowflakes"],["none","None"]];
function gv(p,k){return (p&&p[k]!=null&&p[k]!=="")?p[k]:DEFR[k];}
function lum(hex){var n=parseInt(hex.slice(1),16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;}
function lp(t,i){return h("div",{style:"text-align:center;font-size:.75rem;color:var(--muted)"},[i,h("div",{text:t})]);}
function profile(uid){for(var i=0;i<state.users.length;i++)if(state.users[i].id===uid)return state.users[i];return null;}

  var vl=h("input",{placeholder:"https://…"});vl.value=(state.voice&&state.voice.link)||"";
  c.appendChild(vl);
  c.appendChild(h("button",{text:"Save voice link",onclick:function(){
    if(vl.value&&!/^https:\/\//i.test(vl.value)){say("The link must start with https://");return;}
    db.doc("private/voice").set({link:vl.value.trim()}).then(function(){say("Voice link saved.");}).catch(function(e){say("Could not save: "+((e&&e.message)||"error"));});
  }}));
  c.appendChild(h("p",{"class":"note",text:"Delete buttons show on the Gallery, Comic and comment areas while you are logged in. Songs are set in config.js."}));
  c.appendChild(msg);view.appendChild(c);
}

/* ---------- data ---------- */
function snap(s){return s.docs.map(function(d){var o=d.data();o.id=d.id;return o;});}
function loaded(){
  db.doc("settings/site").onSnapshot(function(s){state.settings=Object.assign({},(s.exists&&s.data())||{},(window.SITE&&SITE.settings)||{});refresh();});
  db.collection("photos").onSnapshot(function(s){state.photos=snap(s);refresh();});
  db.collection("comics").onSnapshot(function(s){state.comics=snap(s);refresh();});
  db.collection("comments").onSnapshot(function(s){state.comments=snap(s);if(document.activeElement.tagName!=="TEXTAREA"&&document.activeElement.tagName!=="INPUT")route();});
  db.collection("likes").onSnapshot(function(s){state.likes=snap(s);if((location.hash||"#home")==="#home")refresh();});
  db.collection("chat").onSnapshot(function(s){state.chat=snap(s);renderChat();},{limit:100});
  db.collection("stories").onSnapshot(function(s){state.stories=snap(s);if((location.hash||"")==="#story")refresh();});
}
(function(){
  var C=window.SITE||{};
  state.settings=Object.assign({},C.settings||{});
  function start(){db=FB.db;assets=FB.assets;loaded();FB.onAuth(onAuthChange);}
  if(window.FB)start();else addEventListener("fb-ready",start);
})();

/* ---------- falling effects ---------- */
var cv=document.getElementById("glitter"),cx=cv.getContext("2d"),W,H,dots=[],paws=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
size();addEventListener("resize",size);
var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
var FXD={gs:"sparkle",gc:"#ffd24a",ps:"paws",pc:"#e8b230"},fx=FXD;
function setFx(o){fx=o?{gs:o.gs,gc:o.gc,ps:o.ps,pc:o.pc}:FXD;}
for(var i=0;i<90;i++)dots.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,vy:Math.random()*.5+.15,vx:(Math.random()-.5)*.3,ph:Math.random()*6.28,sp:Math.random()*.05+.02});
for(var j=0;j<16;j++)paws.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*8+8,vy:Math.random()*.45+.2,vx:(Math.random()-.5)*.25,r:Math.random()*6.28,vr:(Math.random()-.5)*.012,a:Math.random()*.35+.35});
function ell(x,y,rx,ry){cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,6.2832);cx.fill();}
function shape(k,z){
  cx.beginPath();
  if(k==="sparkle"){cx.moveTo(0,-z);cx.lineTo(z*.45,0);cx.lineTo(0,z);cx.lineTo(-z*.45,0);cx.closePath();cx.fill();}
  else if(k==="dots"){cx.arc(0,0,z*.5,0,6.2832);cx.fill();}
  else if(k==="stars"){for(var n=0;n<10;n++){var rr=n%2?z*.4:z,an=-1.5708+n*.6283;cx[n?"lineTo":"moveTo"](Math.cos(an)*rr,Math.sin(an)*rr);}cx.closePath();cx.fill();}
  else if(k==="hearts"){cx.moveTo(0,z*.6);cx.bezierCurveTo(-z*1.2,-z*.2,-z*.6,-z*1.1,0,-z*.45);cx.bezierCurveTo(z*.6,-z*1.1,z*1.2,-z*.2,0,z*.6);cx.fill();}
  else if(k==="flowers"){for(var q=0;q<5;q++){cx.save();cx.rotate(q*1.2566);cx.beginPath();cx.ellipse(0,-z*.5,z*.28,z*.45,0,0,6.2832);cx.fill();cx.restore();}cx.beginPath();cx.arc(0,0,z*.22,0,6.2832);cx.fill();}
  else if(k==="snow"){cx.lineWidth=Math.max(1,z*.12);cx.strokeStyle=cx.fillStyle;for(var w=0;w<3;w++){cx.save();cx.rotate(w*1.0472);cx.beginPath();cx.moveTo(0,-z);cx.lineTo(0,z);cx.stroke();cx.restore();}}
  else if(k==="paws"){ell(0,z*.4,z*.55,z*.45);ell(-z*.62,-z*.1,z*.2,z*.28);ell(-z*.24,-z*.52,z*.2,z*.28);ell(z*.24,-z*.52,z*.2,z*.28);ell(z*.62,-z*.1,z*.2,z*.28);}
}
function tick(){
  cx.clearRect(0,0,W,H);
  if(fx.gs!=="none")dots.forEach(function(d){
    d.ph+=d.sp;if(!still){d.y+=d.vy;d.x+=d.vx+Math.sin(d.ph)*.2;}
    if(d.y>H+5){d.y=-5;d.x=Math.random()*W;}if(d.x<-5)d.x=W+5;if(d.x>W+5)d.x=-5;
    var a=.35+.65*Math.abs(Math.sin(d.ph));
    cx.save();cx.translate(d.x,d.y);cx.globalAlpha=a;cx.fillStyle=fx.gc;cx.shadowColor=fx.gc;cx.shadowBlur=8;
    shape(fx.gs,d.r*(fx.gs==="sparkle"?2.2:fx.gs==="dots"?1.8:3.2));cx.restore();
  });
  if(fx.ps!=="none")paws.forEach(function(p){
    if(!still){p.y+=p.vy;p.x+=p.vx;p.r+=p.vr;}if(p.y>H+30){p.y=-30;p.x=Math.random()*W;}
    cx.save();cx.translate(p.x,p.y);cx.rotate(fx.ps==="hearts"?0:p.r);cx.globalAlpha=p.a;cx.fillStyle=fx.pc;cx.shadowColor=fx.pc;cx.shadowBlur=10;
    shape(fx.ps,p.s);cx.restore();
  });
  requestAnimationFrame(tick);
}
tick();
route();
})();
</script>
