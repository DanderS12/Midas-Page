<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Midas Room</title>
<link rel="stylesheet" href="lounge.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:wght@400;600&display=swap">
<style>
:root{--bg:#0b0805;--panel:#17110a;--gold:#f5c542;--gold2:#c8921b;--gold3:#fff1b0;--text:#f3e6c4;--muted:#b9a273;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at top,var(--glow,#2a1c06) 0,var(--bg) 60%);color:var(--text);font-family:Lora,Georgia,serif;min-height:100vh}
#glitter{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3,nav a,button,.btn{font-family:Cinzel,Georgia,serif}
.gold{background:var(--goldgrad,linear-gradient(90deg,var(--gold2),var(--gold3),var(--gold),var(--gold2)));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:200% 0}}
header{position:relative;text-align:center;padding:18px clamp(104px,22vw,190px) 6px}
.corner{position:absolute;top:8px;left:0;width:clamp(90px,20vw,170px);aspect-ratio:2/3;object-fit:cover;object-position:top;border:2px solid var(--gold2);border-radius:10px;box-shadow:0 0 22px rgba(245,197,66,.5);cursor:zoom-in}
h1{font-size:clamp(2rem,7vw,3.6rem);margin:0;letter-spacing:.08em}
.sub{color:var(--muted);font-style:italic;margin:4px 0 0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 22px;position:sticky;top:env(safe-area-inset-top,0px);padding:8px 0;background:var(--bg);z-index:5}
nav a{color:var(--gold);text-decoration:none;border:1px solid var(--gold2);padding:8px 16px;border-radius:999px;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase}
nav a.on,nav a:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--btnt,#1a1204)}
.card{background:linear-gradient(160deg,var(--card1,#1f1609),var(--panel));border:1px solid var(--gold2);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 0 24px rgba(245,197,66,.12),inset 0 0 30px rgba(245,197,66,.04)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ph{position:relative;border:2px solid var(--gold2);border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 14px rgba(245,197,66,.25)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}
.ph p{margin:0;padding:8px 10px;font-size:.85rem;color:var(--gold3)}
button,.btn{background:var(--btngrad,linear-gradient(135deg,var(--gold2),var(--gold),var(--gold3)));color:var(--btnt,#1a1204);border:0;border-radius:8px;padding:10px 18px;font-weight:700;letter-spacing:.06em;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
button.del{background:#5a1010;color:#ffd7d7;padding:5px 10px;font-size:.75rem}
.ph button.del{position:absolute;top:6px;right:6px}
input,textarea{width:100%;background:var(--inbg,#0e0a04);color:var(--text);border:1px solid var(--gold2);border-radius:8px;padding:10px;font:inherit;margin-bottom:10px}
label{display:block;color:var(--gold);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
.cm{border-bottom:1px solid #3a2a0c;padding:10px 0}.cm b{color:var(--gold)}.cm small{color:var(--muted);margin-left:8px}
.cm p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.center{text-align:center}.muted{color:var(--muted)}.note{font-size:.82rem;color:var(--muted)}
.disc{width:150px;height:150px;border-radius:50%;margin:10px auto 18px;background:conic-gradient(var(--gold2),var(--gold3),var(--gold),var(--gold2),var(--gold3),var(--gold2));border:6px solid #1a1204;box-shadow:0 0 40px rgba(245,197,66,.5);position:relative}
.disc:after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--bg)}
.disc.spin{animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
audio{width:100%;margin:12px 0}
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#2a1c06,#050302);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{max-width:380px;width:100%;text-align:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
#lb img{max-width:100%;max-height:100%;border:3px solid var(--gold2);border-radius:8px}
.err{color:#ff9d9d;min-height:1.2em;font-size:.85rem}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(var(--panel),var(--bg));border-top:1px solid var(--gold2);box-shadow:0 -6px 24px rgba(245,197,66,.2)}
#bar span{font-family:Cinzel,Georgia,serif;color:var(--gold);font-size:.85rem}
#bar audio{flex:1 1 220px;max-width:420px;margin:0}
.like{background:none;border:1px solid var(--gold2);color:var(--gold);padding:4px 14px;margin:2px 10px 10px;border-radius:999px;font-size:.9rem}
.eb{display:flex;flex-wrap:wrap;gap:3px;margin:-4px 0 10px}
.eb button{background:none;border:1px solid #3a2a0c;border-radius:8px;font-size:1.15rem;padding:2px 7px;cursor:pointer;color:inherit}
.roomwrap{border-radius:16px;padding:16px;border:1px solid var(--gold2);margin-bottom:18px;contain:layout paint;isolation:isolate}
.roomwrap .card{background:var(--panel)}
.roomwrap button,.roomwrap .btn{background:var(--btngrad,var(--btn));color:var(--btnt)}
.pin{position:absolute;top:6px;left:8px;font-size:1.4rem;filter:drop-shadow(0 0 4px #000)}
.ph button.pinb{left:6px;right:auto;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1204}
.card,.roomwrap,.storytext{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.card p,.card h2,.card h3,.storytext p{overflow-wrap:anywhere;word-break:break-word;max-width:100%}
#vpill{position:fixed;right:10px;bottom:84px;z-index:25;display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border:1px solid var(--gold2);border-radius:999px;box-shadow:0 0 18px rgba(245,197,66,.35);font-family:Cinzel,Georgia,serif;font-size:.8rem;color:var(--gold)}
#vpill button{padding:5px 12px;font-size:.75rem}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #3a2a0c;border-radius:10px;margin:6px 0;text-align:left}
.vrow .dot{width:12px;height:12px;border-radius:50%;background:#5a4a2a;flex:none}
.vrow.speak{border-color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.6)}
.vrow.speak .dot{background:#6dff8a}
#menubtn{display:none}
@media (max-width:720px){
  #menubtn{display:inline-block;width:100%}
  nav a{display:none}
  nav.open a{display:block;width:100%;text-align:center}
  nav.open{max-height:75vh;overflow-y:auto}
}
#fxtop{position:fixed;inset:0;width:100%;height:100%;z-index:9998;pointer-events:none}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:#6b6b6b}
.sdot.online{background:#3ddc84}.sdot.away{background:#ffc83d}.sdot.dnd{background:#ff4d4d}
.av{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold2);flex:none}
.banner{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:12px;margin-bottom:12px;border:1px solid var(--gold2);display:block}
.chip{display:inline-block;padding:3px 10px;margin:3px;border:1px solid var(--gold2);border-radius:999px;font-size:.8rem;color:var(--gold)}
.storybox{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.storypics{flex:0 1 260px;max-width:100%;display:flex;flex-direction:column;gap:12px}
.storypics .ph img{aspect-ratio:auto;object-fit:contain;max-height:420px;background:#000}
.storytext{flex:1 1 300px;min-width:0}
select{width:100%;padding:10px;background:var(--inbg,#0e0a04);color:var(--text);border:1px solid var(--gold2);border-radius:8px;margin-bottom:10px;font:inherit}
.like.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--btnt,#1a1204)}
@media (prefers-reduced-motion:reduce){.gold,.disc.spin{animation:none}}
.visitor-controls{display:flex;justify-content:flex-end;margin-bottom:8px}
#reduce-effects{font-size:.72rem;padding:7px 10px}
.reduce-effects #glitter,.reduce-effects #fxtop{display:none}
.reduce-effects .gold,.reduce-effects .disc.spin{animation:none!important}
.reduce-effects .beat-active{box-shadow:none}
.editor-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.editor-tabs [role=tab]{background:transparent;color:var(--gold);border:1px solid var(--gold2);font-size:.8rem;padding:10px 12px;letter-spacing:.02em}
.editor-tabs [aria-selected=true]{background:var(--btngrad,linear-gradient(135deg,var(--gold2),var(--gold)));color:var(--btnt,#1a1204)}
.editor-tabs [role=tab]:focus-visible,.editor-panel:focus-visible{outline:2px solid var(--gold3);outline-offset:3px}
.editor-panel[hidden]{display:none!important}
.editor-panel>h3{margin-top:0}
.editor-actions{border-top:1px solid var(--gold2);padding-top:16px;margin-top:18px}
@media(max-width:480px){.editor-tabs [role=tab]{flex:1 1 42%;min-width:0}}
#admin-access{position:fixed;top:env(safe-area-inset-top,0px);right:0;width:48px;height:48px;padding:0;border:0;background:transparent;color:transparent;z-index:9999;touch-action:manipulation}
#admin-access:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
.role-admin{color:#ffd24a!important;font-variant:small-caps;text-shadow:0 0 10px #e8b230;letter-spacing:.08em}
.role-creator{color:#d7a7ff!important;font-style:italic;text-shadow:0 0 10px #9e55e8}
.role-sponsor{color:#82e6ff!important;letter-spacing:.08em;text-shadow:0 0 10px #2ca5c6}
.beat-active .card,.beat-active .roomwrap,.beat-active .ph,.beat-active img{box-shadow:0 0 var(--beat-glow,0px) var(--gold2)}
@media(prefers-reduced-motion:reduce){.beat-active .card,.beat-active .roomwrap,.beat-active .ph,.beat-active img{box-shadow:none}}
</style>
</head>
<body>
<button id="admin-access" type="button" aria-label="Administrator login"></button>
<canvas id="glitter"></canvas>
<canvas id="fxtop"></canvas>

<div id="gate"><div class="card">
  <h1 class="gold" style="font-size:2.2rem">The Midas Room</h1>
  <p class="sub">Everything here turns to gold.</p>
  <label for="gp">Password</label>
  <input id="gp" type="password" autocomplete="off" placeholder="Enter the password">
  <div class="err" id="gerr"></div>
  <button id="gbtn">Enter</button>
</div></div>

<div id="lb"><img alt=""></div>
<div id="vpill"><span id="vpt"></span><button id="vpm" type="button">Mute</button><button id="vpl" type="button" class="del">Leave</button></div>
<div id="vaudio" style="position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden"></div>
<div id="bar"><span id="bt"></span><audio id="au" controls loop preload="auto"></audio></div>

<div class="wrap">
  <div class="visitor-controls"><button id="reduce-effects" type="button" aria-pressed="false">Reduce effects: off</button></div>
  <header><img class="corner" id="cr" src="media/corner1.jpg" alt="Golden portrait" onclick="document.getElementById('lb').querySelector('img').src=this.src;document.getElementById('lb').style.display='flex'"><h1><span>👑</span> <span class="gold">The Midas Room</span> <span>👑</span></h1><p class="sub">A private gallery of golden moments</p></header>
  <nav id="nav">
    <button id="menubtn" type="button">☰ Menu</button>
    <a href="#home">✨ Gallery</a><a href="#comic">📜 Comic</a><a href="#story">👑 Story</a><a href="#chat">💬 Live Chat</a><a href="#login">🔐 Login</a><a href="#rooms">🏆 Rooms</a><a href="#friends">👥 Friends</a><a href="#alerts">🔔 Alerts</a><a href="#dm">💌 Messages</a><a href="#voice">🎙️ Voice</a><a href="#settings">⚙️ Settings</a><a href="#nsfw">🔞 18+</a><a href="#sponsors">💖 Creators</a><a href="#give">🪙 Donate</a><a href="#cassie">🍸 Cassie Lounge</a><a href="#arcade">🎮 Arcade Games</a>
  </nav>
  <main id="view"></main>
</div>

<script src="name-policy.js"></script>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,query,orderBy,limit,where,updateDoc,runTransaction,serverTimestamp,getDocs,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const onSnap=function(ref,next){return onSnapshot(ref,next,function(e){if(window.fbError)window.fbError(e);});};
const C=window.SITE||{};
function shrinkTo(file,w,h,q){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)||file.size>10*1024*1024){rej(new Error("Choose an image up to 10 MB."));return;}
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      const sc=Math.max(w/img.width,h/img.height),dw=img.width*sc,dh=img.height*sc;
      cv.getContext("2d").drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
      URL.revokeObjectURL(u);res(cv.toDataURL("image/jpeg",q));
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("Could not read that picture"));};
    img.src=u;
  });
}
function shrink(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)||file.size>10*1024*1024){rej(new Error("Choose an image up to 10 MB."));return;}
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      let w=img.width,h=img.height,m=Math.max(w,h),mx=900;
      if(m>mx){w=Math.round(w*mx/m);h=Math.round(h*mx/m);}
      const cv=document.createElement("canvas");cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.75,d=cv.toDataURL("image/jpeg",q);
      while(d.length>850000&&q>0.3){q-=0.1;d=cv.toDataURL("image/jpeg",q);}
      URL.revokeObjectURL(u);
      if(d.length>=900000)rej(new Error("Picture is too big"));else res(d);
    };
    img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("Could not read that picture"));};
    img.src=u;
  });
}
if(C.firebase&&C.firebase.apiKey){
  const app=initializeApp(C.firebase),fs=getFirestore(app),au=getAuth(app);
  const wd=function(ref){return {
    set:function(d){return setDoc(ref,d);},
    update:function(d){return updateDoc(ref,d);},
    delete:function(){return deleteDoc(ref);},
    onSnapshot:function(cb){return onSnap(ref,function(s){cb({exists:s.exists(),data:function(){return s.data();}});});}
  };};
  window.FB={
    db:{
      collection:function(n){return {
        doc:function(id){return wd(doc(fs,n,id));},
        onSnapshot:function(cb,o){var q=collection(fs,n);if(o&&o.limit)q=query(q,orderBy("ts","desc"),limit(o.limit));if(o&&o.where)q=query(q,where(o.where[0],o.where[1],o.where[2]));return onSnap(q,function(s){cb({docs:s.docs.map(function(d){return {id:d.id,data:function(){return d.data();}};})});});}
      };},
      doc:function(p){return wd(doc(fs,...p.split("/")));}
    },
    assets:{upload:function(f){return shrink(f).then(function(u){return {url:u,id:""};});},avatar:function(f){return shrinkTo(f,96,96,.7);},corner:function(f){return shrinkTo(f,360,540,.8);},banner:function(f){return shrinkTo(f,900,300,.7);},delete:function(){return Promise.resolve();}},
    recordSession:async function(){
      const user=au.currentUser;if(!user)return;
      const token=await user.getIdTokenResult(),email=(user.email||'').toLowerCase();
      await setDoc(doc(fs,'memberDirectory',user.uid),{uid:user.uid,email:email});
      if(email===(C.adminEmail||'').toLowerCase())await setDoc(doc(fs,'siteRoles',user.uid),{role:'admin'});
      const id=user.uid+'_'+token.claims.auth_time,entry=doc(fs,'loginHistory',id);
      await runTransaction(fs,async tx=>{if(!(await tx.get(entry)).exists())tx.set(entry,{uid:user.uid,email:email,authTime:token.claims.auth_time,ts:serverTimestamp()});});
    },
    nameAvailable:async function(value){
      if(!NamePolicy.valid(value))throw new Error('Use 3–24 letters, numbers, spaces, underscores or hyphens.');
      const saved=await getDoc(doc(fs,'displayNames',NamePolicy.key(value)));
      return !saved.exists()||(au.currentUser&&saved.data().uid===au.currentUser.uid);
    },
    saveProfile:async function(uid,data){
      const name=NamePolicy.normalize(data.name),key=NamePolicy.key(name),room=doc(fs,'users',uid);
      await runTransaction(fs,async tx=>{
        const existing=await tx.get(room);
        if(existing.exists()&&existing.data().name===data.name){tx.set(room,data);return;}
        if(!NamePolicy.valid(name))throw new Error('Use 3–24 letters, numbers, spaces, underscores or hyphens.');
        const settings=await tx.get(doc(fs,'settings','site'));
        if(!settings.exists()||!settings.data().namesReady)throw new Error('The admin is preparing unique names. Try again later.');
        const claim=doc(fs,'displayNames',key),saved=await tx.get(claim);
        if(saved.exists()&&saved.data().uid!==uid)throw new Error('That name is already taken. Choose another.');
        const oldKey=existing.exists()?NamePolicy.key(existing.data().name):null;
        let old=null;if(oldKey&&oldKey!==key&&NamePolicy.valid(existing.data().name))old=await tx.get(doc(fs,'displayNames',oldKey));
        tx.set(claim,{uid:uid});tx.set(room,Object.assign({},data,{name:name}));
        if(old&&old.exists()&&old.data().uid===uid)tx.delete(doc(fs,'displayNames',oldKey));
      });
    },
    renameMember:async function(uid,value){
      const name=NamePolicy.normalize(value),key=NamePolicy.key(name);
      if(!NamePolicy.valid(name))throw new Error('Use 3–24 letters, numbers, spaces, underscores or hyphens.');
      const current=await getDocs(collection(fs,'users')),archived=await getDocs(collection(fs,'roomArchive'));
      if(current.docs.some(d=>d.id!==uid&&NamePolicy.key(d.data().name)===key)||archived.docs.some(d=>d.id!==uid&&NamePolicy.key(d.data().room.name)===key))throw new Error('Another current or archived room uses that name.');
      await runTransaction(fs,async tx=>{const room=doc(fs,'users',uid),claim=doc(fs,'displayNames',key),saved=await tx.get(room),reservation=await tx.get(claim);
        if(!saved.exists())throw new Error('Only an existing member room can be renamed here.');
        if(reservation.exists()&&reservation.data().uid!==uid)throw new Error('That name is reserved.');
        tx.set(claim,{uid:uid});tx.update(room,{name:name});
      });
    },
    prepareNames:async function(){
      const snapshots=await Promise.all(['users','roomArchive'].map(name=>getDocs(collection(fs,name))));
      const people=snapshots[0].docs.map(d=>({id:d.id,name:d.data().name}));
      snapshots[1].docs.forEach(d=>{if(!people.some(p=>p.id===d.id))people.push({id:d.id,name:d.data().room.name});});
      const duplicates=NamePolicy.conflicts(people);
      if(duplicates.length)throw new Error('Existing duplicate names need review: '+duplicates.map(g=>g.key+' ('+g.users.length+' accounts)').join(', ')+'. No names were changed.');
      for(const person of people){
        if(!NamePolicy.valid(person.name))continue;
        const ref=doc(fs,'displayNames',NamePolicy.key(person.name));
        await runTransaction(fs,async tx=>{const existing=await tx.get(ref);if(existing.exists()&&existing.data().uid!==person.id)throw new Error('A reservation conflict needs review for '+person.name);tx.set(ref,{uid:person.id});});
      }
      // Activation is separate from reservations; a partial failure never enables signup.
      await updateDoc(doc(fs,'settings','site'),{namesReady:true});
      return people.length;
    },
    exportContent:async function(){
      const names=['photos','comics','settings','stories','spics','stracks','schunks','sponsors','cpics','users','uphotos','uimg','ubg','tracks','mchunks','announcements','roomArchive'];
      const result={format:'midas-content',version:1,exportedAt:new Date().toISOString(),collections:{}};
      for(const name of names){const snapshot=await getDocs(collection(fs,name));result.collections[name]=snapshot.docs.map(d=>({id:d.id,data:d.data()}));}
      return result;
    },
    archiveRoom:async function(uid){
      const room=doc(fs,'users',uid),archive=doc(fs,'roomArchive',uid);
      await runTransaction(fs,async tx=>{const saved=await tx.get(room);if(!saved.exists())throw new Error('Room not found.');tx.set(archive,{room:saved.data(),deletedAt:serverTimestamp()});tx.delete(room);});
    },
    restoreRoom:async function(uid,name){
      const room=doc(fs,'users',uid),archive=doc(fs,'roomArchive',uid);
      await runTransaction(fs,async tx=>{
        const existing=await tx.get(room),saved=await tx.get(archive);

  cx.beginPath();cx.moveTo(-z*.5,-z*.6);cx.lineTo(z*.5,-z*.6);cx.lineTo(z*.9,-z*.1);cx.lineTo(0,z*.9);cx.lineTo(-z*.9,-z*.1);cx.closePath();cx.fill();
  holes(function(){cx.lineWidth=Math.max(1,z*.05);cx.beginPath();cx.moveTo(-z*.9,-z*.1);cx.lineTo(z*.9,-z*.1);cx.moveTo(-z*.5,-z*.6);cx.lineTo(-z*.25,-z*.1);cx.lineTo(0,z*.9);cx.moveTo(z*.5,-z*.6);cx.lineTo(z*.25,-z*.1);cx.lineTo(0,z*.9);cx.stroke();});
}
function shape(k,z){
  cx.beginPath();
  if(k==="sparkle"){cx.moveTo(0,-z);cx.lineTo(z*.45,0);cx.lineTo(0,z);cx.lineTo(-z*.45,0);cx.closePath();cx.fill();}
  else if(k==="dots"){cx.arc(0,0,z*.5,0,6.2832);cx.fill();}
  else if(k==="stars"){for(var n=0;n<10;n++){var rr=n%2?z*.4:z,an=-1.5708+n*.6283;cx[n?"lineTo":"moveTo"](Math.cos(an)*rr,Math.sin(an)*rr);}cx.closePath();cx.fill();}
  else if(k==="hearts"){cx.moveTo(0,z*.6);cx.bezierCurveTo(-z*1.2,-z*.2,-z*.6,-z*1.1,0,-z*.45);cx.bezierCurveTo(z*.6,-z*1.1,z*1.2,-z*.2,0,z*.6);cx.fill();}
  else if(k==="flowers"){for(var q=0;q<5;q++){cx.save();cx.rotate(q*1.2566);cx.beginPath();cx.ellipse(0,-z*.5,z*.28,z*.45,0,0,6.2832);cx.fill();cx.restore();}cx.beginPath();cx.arc(0,0,z*.22,0,6.2832);cx.fill();}
  else if(k==="snow"){cx.lineWidth=Math.max(1,z*.12);cx.strokeStyle=cx.fillStyle;for(var w=0;w<3;w++){cx.save();cx.rotate(w*1.0472);cx.beginPath();cx.moveTo(0,-z);cx.lineTo(0,z);cx.stroke();cx.restore();}}
  else if(k==="paws"){ell(0,z*.4,z*.55,z*.45);ell(-z*.62,-z*.1,z*.2,z*.28);ell(-z*.24,-z*.52,z*.2,z*.28);ell(z*.24,-z*.52,z*.2,z*.28);ell(z*.62,-z*.1,z*.2,z*.28);}
  else if(k==="smiles")smile(z);
  else if(k==="coins")coinS(z);
  else if(k==="rain")rainS(z);
  else if(k==="notes")noteS(z);
  else if(k==="petals")petalS(z);
  else if(k==="moons")moonS(z);
  else if(k==="suns")sunS(z);
  else if(k==="feathers")featherS(z);
  else if(k==="bolts")boltS(z);
  else if(k==="pixels")pixelS(z);
  else if(k==="bubbles")bubbles(z);
  else if(k==="fish")fish(z);
  else if(k==="skulls")skull(z,false);
  else if(k==="crystalskulls")skull(z,true);
  else if(k==="crystals")crystals(z);
  else if(k==="bats")bat(z);
  else if(k==="pumpkins")pumpkin(z);
  else if(k==="ghosts")ghost(z);
  else if(k==="autumn")autumn(z);
  else if(k==="leaf420")leaf420(z);
  else if(k==="clover")clover(z);
  else if(k==="fireworks")fireworks(z);
}
var particleFrame=0;
function resumeParticles(){if(!particleFrame&&!still&&!document.hidden)particleFrame=requestAnimationFrame(tick);}
addEventListener('effects-preference',function(){if(still){cancelAnimationFrame(particleFrame);particleFrame=0;cx.clearRect(0,0,W,H);}else resumeParticles();});
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(particleFrame);particleFrame=0;}else resumeParticles();});
function tick(){
  particleFrame=0;if(still||document.hidden)return;
  cx.clearRect(0,0,W,H);
  if(fx.gs!=="none")dots.forEach(function(d){
    d.ph+=d.sp;if(!still){d.y+=d.vy;d.x+=d.vx+Math.sin(d.ph)*.2;}
    if(d.y>H+5){d.y=-5;d.x=Math.random()*W;}if(d.x<-5)d.x=W+5;if(d.x>W+5)d.x=-5;
    var a=.35+.65*Math.abs(Math.sin(d.ph));
    var gcol=fx.gc==="rainbow"?"hsl("+(((d.ph*57+d.x*.25)%360+360)%360)+",95%,62%)":fx.gc;
    cx.save();cx.translate(d.x,d.y);cx.globalAlpha=a;cx.fillStyle=gcol;cx.shadowColor=gcol;cx.shadowBlur=8;
    shape(fx.gs,d.r*gmul(fx.gs));cx.restore();
  });
  if(fx.ps!=="none")paws.forEach(function(p){
    if(!still){p.y+=p.vy*(SPD[fx.ps]||1);p.x+=p.vx;p.r+=p.vr;}if(p.y>H+30){p.y=-30;p.x=Math.random()*W;}
    cx.save();cx.translate(p.x,p.y);cx.rotate(NOROT[fx.ps]?0:(SWAY[fx.ps]?Math.sin(p.r*1.5)*.35:p.r));cx.globalAlpha=p.a;var pcol=fx.pc==="rainbow"?"hsl("+(((p.r*60+p.x*.2)%360+360)%360)+",95%,62%)":fx.pc;cx.fillStyle=pcol;cx.shadowColor=pcol;cx.shadowBlur=10;
    shape(fx.ps,p.s);cx.restore();
  });
  particleFrame=requestAnimationFrame(tick);
}
resumeParticles();
/* ---------- cursor and touch effects ---------- */
var tv=document.getElementById("fxtop"),tc2=tv.getContext("2d"),fxp=[],mxy={x:-99,y:-99,lx:-99,ly:-99,on:false},fxRun=false,hueN=0,fxLast=0;
function tsize(){tv.width=innerWidth;tv.height=innerHeight;}
tsize();addEventListener("resize",tsize);
function hexA(hex,a){var n=parseInt(hex.slice(1),16);return "rgba("+(n>>16)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function alphaCol(c,a){return c.charAt(0)==="#"?hexA(c,a):c.replace("hsl(","hsla(").replace(")",","+a+")");}
function pcolor(c,fb){if(c==="rainbow"){hueN=(hueN+41)%360;return "hsl("+hueN+",95%,62%)";}return isHex(c)?c:fb;}
var SHK={};SH.forEach(function(x){SHK[x[0]]=1;});
function withTop(fn){var o=cx;cx=tc2;try{fn();}finally{cx=o;}}
function fxKick(){if(!fxRun){fxRun=true;fxLast=0;requestAnimationFrame(fxTick);}}
function spawnTrail(x,y){
  var k=fx.cur;if(!k||k==="none"||k==="glow"||still||fxp.length>170)return;
  if(k==="embers"){fxp.push({t:"dot",x:x+(Math.random()-.5)*8,y:y,vx:(Math.random()-.5)*.6,vy:-(Math.random()*1.2+.4),g:-.004,life:750,age:0,s:Math.random()*3+2,col:pcolor(fx.cc,"#ff8a1f"),glow:1});return;}
  if(k==="comet"){fxp.push({t:"dot",x:x,y:y,vx:0,vy:0,g:0,life:380,age:0,s:6,col:pcolor(fx.cc,"#ffd24a"),glow:1,shrink:1});return;}
  if(!SHK[k])return;
  fxp.push({t:"shape",k:k,x:x,y:y,vx:(Math.random()-.5)*.8,vy:(Math.random()-.2)*.8,g:.012,life:700,age:0,s:Math.random()*5+10,r:Math.random()*6.28,vr:(Math.random()-.5)*.1,col:pcolor(fx.cc,"#ffd24a")});
}
function spawnTap(x,y){
  var k=fx.tap;if(!k||k==="none"||still||fxp.length>300)return;
  var tcol=fx.tc;
  if(k==="ripple"){for(var i=0;i<3;i++)fxp.push({t:"ring",x:x,y:y,life:750,age:-i*150,maxr:46+i*16,col:pcolor(tcol,"#ffd24a")});}
  else if(k==="rays"){var rc=pcolor(tcol,"#ffd24a");for(var j=0;j<12;j++)fxp.push({t:"ray",x:x,y:y,a:j*.5236,life:620,age:0,col:rc});}
  else if(k==="coins"){for(var q=0;q<10;q++){var an=-Math.PI/2+(Math.random()-.5)*2.2,sp=Math.random()*3+2.5;fxp.push({t:"shape",k:"coins",x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,g:.14,life:950,age:0,s:11,r:0,vr:(Math.random()-.5)*.3,col:pcolor(tcol,"#ffd24a")});}}
  else if(k==="confetti"){for(var c2=0;c2<28;c2++){var a2=Math.random()*6.28,s2=Math.random()*4+1.5;fxp.push({t:"conf",x:x,y:y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2-2,g:.12,life:1000,age:0,w:Math.random()*6+4,hh:Math.random()*4+3,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,col:"hsl("+Math.floor(Math.random()*360)+",90%,60%)"});}}
  else if(k.indexOf("b:")===0&&SHK[k.slice(2)]){var sh=k.slice(2);for(var m=0;m<12;m++){var a3=m*.5236+Math.random()*.3,s3=Math.random()*2.5+1.6;fxp.push({t:"shape",k:sh,x:x,y:y,vx:Math.cos(a3)*s3,vy:Math.sin(a3)*s3,g:.06,life:850,age:0,s:Math.random()*6+10,r:Math.random()*6.28,vr:(Math.random()-.5)*.2,col:pcolor(tcol,"#ffd24a")});}}
  fxKick();
}
function fxTick(ts){
  tc2.clearRect(0,0,tv.width,tv.height);
  var dt=fxLast?Math.min(40,ts-fxLast):16;fxLast=ts;
  var glowOn=(fx.cur==="glow"&&mxy.on&&!still);
  if(glowOn){
    var gc=pcolor(fx.cc,"#ffd24a");
    tc2.save();tc2.globalCompositeOperation="lighter";
    var gr=tc2.createRadialGradient(mxy.x,mxy.y,0,mxy.x,mxy.y,85);
    gr.addColorStop(0,alphaCol(gc,.5));gr.addColorStop(.4,alphaCol(gc,.18));gr.addColorStop(1,alphaCol(gc,0));
    tc2.fillStyle=gr;tc2.beginPath();tc2.arc(mxy.x,mxy.y,85,0,6.2832);tc2.fill();tc2.restore();
  }
  for(var i=fxp.length-1;i>=0;i--){
    var p=fxp[i];p.age+=dt;
    if(p.age>=p.life){fxp.splice(i,1);continue;}
    if(p.age<0)continue;
    var f=p.age/p.life,st=dt/16;
    if(p.t==="dot"){
      p.x+=p.vx*st;p.vy+=p.g*st;p.y+=p.vy*st;
      tc2.save();tc2.globalAlpha=1-f;tc2.fillStyle=p.col;tc2.shadowColor=p.col;tc2.shadowBlur=p.glow?10:0;
      tc2.beginPath();tc2.arc(p.x,p.y,p.shrink?p.s*(1-f):p.s,0,6.2832);tc2.fill();tc2.restore();
    }else if(p.t==="shape"){
      p.x+=p.vx*st;p.vy+=p.g*st;p.y+=p.vy*st;p.r+=p.vr*st;
      withTop(function(){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=1-f;cx.fillStyle=p.col;cx.shadowColor=p.col;cx.shadowBlur=8;shape(p.k,p.s*(1-f*.4));cx.restore();});
    }else if(p.t==="ring"){
      tc2.save();tc2.globalAlpha=1-f;tc2.strokeStyle=p.col;tc2.lineWidth=3;tc2.shadowColor=p.col;tc2.shadowBlur=8;
      tc2.beginPath();tc2.arc(p.x,p.y,p.maxr*Math.sqrt(f),0,6.2832);tc2.stroke();tc2.restore();
    }else if(p.t==="ray"){
      tc2.save();tc2.globalAlpha=1-f;tc2.strokeStyle=p.col;tc2.lineWidth=3;tc2.lineCap="round";tc2.shadowColor=p.col;tc2.shadowBlur=8;
      tc2.beginPath();tc2.moveTo(p.x+Math.cos(p.a)*(8+f*10),p.y+Math.sin(p.a)*(8+f*10));tc2.lineTo(p.x+Math.cos(p.a)*(14+f*42),p.y+Math.sin(p.a)*(14+f*42));tc2.stroke();tc2.restore();
    }else if(p.t==="conf"){
      p.x+=p.vx*st;p.vy+=p.g*st;p.y+=p.vy*st;p.r+=p.vr*st;
      tc2.save();tc2.globalAlpha=1-f*f;tc2.translate(p.x,p.y);tc2.rotate(p.r);tc2.fillStyle=p.col;tc2.fillRect(-p.w/2,-p.hh/2,p.w,p.hh);tc2.restore();
    }
  }
  if(fxp.length||glowOn)requestAnimationFrame(fxTick);else{fxRun=false;tc2.clearRect(0,0,tv.width,tv.height);}
}
addEventListener("pointermove",function(e){
  if(e.pointerType==="touch"&&!e.isPrimary)return;
  mxy.x=e.clientX;mxy.y=e.clientY;mxy.on=true;
  var dx=e.clientX-mxy.lx,dy=e.clientY-mxy.ly,step=fx.cur==="comet"?4:fx.cur==="embers"?10:16;
  if(dx*dx+dy*dy>step*step){mxy.lx=e.clientX;mxy.ly=e.clientY;spawnTrail(e.clientX,e.clientY);}
  if(fx.cur&&fx.cur!=="none")fxKick();
},{passive:true});
addEventListener("pointerup",function(e){if(e.pointerType==="touch")mxy.on=false;},{passive:true});
document.addEventListener("mouseleave",function(){mxy.on=false;});
addEventListener("pointerdown",function(e){spawnTap(e.clientX,e.clientY);},{passive:true});
route();
})();
</script>
